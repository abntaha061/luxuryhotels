name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً بضغطة زر من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7' # يضمن وجود إصدار متوافق حتى لو لم ترفع ملفات الـ wrapper

    # إنشاء debug.keystore في المسار القياسي وأيضاً في مجلد المشروع احتياطياً
    - name: Generate debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        cp ~/.android/debug.keystore debug.keystore
        cp ~/.android/debug.keystore app/debug.keystore || true

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
